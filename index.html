<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompts JUS IA — Vara Única de Bujari</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c2b26">
<style>
  :root{
    --ink:#1c2b26;
    --paper:#f6f3ea;
    --paper-2:#ede8d8;
    --gold:#a9832f;
    --gold-soft:#c9a35c;
    --line:#d8cfb8;
    --green-deep:#233d33;
    --green-mid:#3c5c4d;
    --danger:#8a3324;
    --serif:'Source Serif Pro','Georgia',serif;
    --mono:'JetBrains Mono','Courier New',monospace;
    --sans:'Inter','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }
  .selo{
    position:fixed;
    top:14px;
    right:16px;
    font-family:var(--serif);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    border:1px solid var(--gold);
    padding:4px 10px;
    border-radius:2px;
    opacity:.85;
    z-index:5;
  }
  header{
    background:var(--green-deep);
    color:var(--paper);
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
    border-bottom:3px solid var(--gold);
  }
  header::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 14px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(22px,5vw,32px);
    margin:0 0 4px;
    letter-spacing:.01em;
  }
  .subtitulo{
    font-family:var(--serif);
    font-style:italic;
    font-size:14px;
    color:#cfd9d0;
    margin:0;
  }
  main{
    max-width:920px;
    margin:0 auto;
    padding:22px 16px 80px;
  }
  .busca-wrap{
    position:sticky;
    top:0;
    background:var(--paper);
    padding:14px 0 12px;
    z-index:4;
    border-bottom:1px solid var(--line);
  }
  .busca{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 14px;
  }
  .busca svg{flex-shrink:0;opacity:.5;}
  .busca input{
    flex:1;
    border:none;
    outline:none;
    font-family:var(--sans);
    font-size:15px;
    background:transparent;
    color:var(--ink);
  }
  .busca input::placeholder{color:#9a9282;}
  .contador{
    font-family:var(--mono);
    font-size:11px;
    color:#8a8272;
    margin-top:8px;
    letter-spacing:.02em;
  }
  .categorias{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .cat-btn{
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--green-mid);
    cursor:pointer;
    transition:all .15s ease;
  }
  .cat-btn:hover{border-color:var(--gold-soft);}
  .cat-btn.ativo{
    background:var(--green-deep);
    color:var(--paper);
    border-color:var(--green-deep);
  }
  .grupo{
    margin-top:32px;
  }
  .grupo-titulo{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:14px;
  }
  .grupo-titulo h2{
    font-family:var(--serif);
    font-size:19px;
    font-weight:600;
    margin:0;
    color:var(--green-deep);
  }
  .grupo-titulo .linha{
    flex:1;
    height:1px;
    background:var(--line);
  }
  .grupo-titulo .qtd{
    font-family:var(--mono);
    font-size:11px;
    color:#9a9282;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-left:3px solid var(--gold-soft);
    border-radius:4px;
    padding:16px 18px;
    margin-bottom:12px;
    transition:box-shadow .15s ease, border-left-color .15s ease;
  }
  .card:hover{
    box-shadow:0 2px 10px rgba(28,43,38,.06);
    border-left-color:var(--gold);
  }
  .card-topo{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:8px;
  }
  .card-titulo{
    font-family:var(--serif);
    font-weight:600;
    font-size:16px;
    color:var(--ink);
    margin:0;
  }
  .card-texto{
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.6;
    color:#4a453a;
    white-space:pre-wrap;
    max-height:78px;
    overflow:hidden;
    position:relative;
    margin-bottom:6px;
  }
  .card-texto.expandido{max-height:none;}
  .fade{
    position:absolute;
    bottom:0;left:0;right:0;
    height:32px;
    background:linear-gradient(transparent, #fff);
  }
  .card-texto.expandido .fade{display:none;}
  .card-acoes{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
  }
  .ver-mais{
    font-family:var(--mono);
    font-size:11px;
    color:var(--green-mid);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }
  .copiar-btn{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    background:var(--green-deep);
    color:var(--paper);
    border:none;
    padding:8px 14px;
    border-radius:4px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .copiar-btn:hover{background:var(--green-mid);}
  .copiar-btn.copiado{background:var(--gold);}
  .vazio{
    text-align:center;
    padding:60px 20px;
    color:#9a9282;
    font-family:var(--serif);
    font-style:italic;
  }
  .instalar-dica{
    max-width:920px;
    margin:0 auto;
    padding:0 16px;
  }
  .instalar-banner{
    margin-top:18px;
    background:var(--paper-2);
    border:1px dashed var(--gold-soft);
    border-radius:6px;
    padding:12px 16px;
    font-size:13px;
    color:var(--green-deep);
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .instalar-banner.visivel{display:flex;}
  .instalar-banner button{
    font-family:var(--mono);
    font-size:12px;
    background:var(--green-deep);
    color:#fff;
    border:none;
    padding:7px 12px;
    border-radius:4px;
    cursor:pointer;
    white-space:nowrap;
  }
  @media (max-width:480px){
    header{padding:22px 16px 18px;}
    .card{padding:14px;}
  }
</style>
</head>
<body>

<div class="selo">Vara Única · Bujari/AC</div>

<header>
  <p class="eyebrow">Assessoria Jurídica · Inteligência Artificial</p>
  <h1>Prompts JUS IA</h1>
  <p class="subtitulo">Biblioteca de comandos por competência — pronto para copiar e colar</p>
</header>

<main>
  <div class="busca-wrap">
    <div class="busca">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="campoBusca" type="text" placeholder="Buscar por palavra-chave, ex.: tutela, dosimetria, ofício...">
    </div>
    <div class="contador" id="contador"></div>
    <div class="categorias" id="filtrosCategoria"></div>
  </div>

  <div id="listaPrompts"></div>
  <div class="vazio" id="vazio" style="display:none;">Nenhum prompt encontrado com esse termo.</div>
</main>

<div class="instalar-dica">
  <div class="instalar-banner" id="bannerInstalar">
    <span>Instale este app na tela inicial para acesso rápido.</span>
    <button id="btnInstalar">Instalar</button>
  </div>
</div>

<script src="prompts.js"></script>
<script>
const lista = document.getElementById('listaPrompts');
const vazio = document.getElementById('vazio');
const contador = document.getElementById('contador');
const campoBusca = document.getElementById('campoBusca');
const filtrosCategoria = document.getElementById('filtrosCategoria');

let categoriaAtiva = 'Todas';

function normalizar(txt){
  return txt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function montarFiltros(){
  const categorias = ['Todas', ...new Set(PROMPTS.map(p => p.categoria))];
  filtrosCategoria.innerHTML = categorias.map(c =>
    `<button class="cat-btn ${c===categoriaAtiva?'ativo':''}" data-cat="${c}">${c}</button>`
  ).join('');
  filtrosCategoria.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      categoriaAtiva = btn.dataset.cat;
      montarFiltros();
      renderizar();
    });
  });
}

function renderizar(){
  const termo = normalizar(campoBusca.value.trim());
  let filtrados = PROMPTS.filter(p=>{
    const passaCategoria = categoriaAtiva === 'Todas' || p.categoria === categoriaAtiva;
    const passaBusca = !termo ||
      normalizar(p.titulo).includes(termo) ||
      normalizar(p.texto).includes(termo) ||
      normalizar(p.categoria).includes(termo);
    return passaCategoria && passaBusca;
  });

  contador.textContent = `${filtrados.length} prompt${filtrados.length===1?'':'s'} encontrado${filtrados.length===1?'':'s'}`;

  if(filtrados.length === 0){
    lista.innerHTML = '';
    vazio.style.display = 'block';
    return;
  }
  vazio.style.display = 'none';

  const porCategoria = {};
  filtrados.forEach(p=>{
    if(!porCategoria[p.categoria]) porCategoria[p.categoria] = [];
    porCategoria[p.categoria].push(p);
  });

  lista.innerHTML = Object.entries(porCategoria).map(([cat, itens])=>`
    <div class="grupo">
      <div class="grupo-titulo">
        <h2>${cat}</h2>
        <div class="linha"></div>
        <span class="qtd">${itens.length}</span>
      </div>
      ${itens.map(p => cardHTML(p)).join('')}
    </div>
  `).join('');

  lista.querySelectorAll('.copiar-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> copiarTexto(btn));
  });
  lista.querySelectorAll('.ver-mais').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const texto = btn.closest('.card').querySelector('.card-texto');
      texto.classList.toggle('expandido');
      btn.textContent = texto.classList.contains('expandido') ? 'ver menos' : 'ver mais';
    });
  });
}

function cardHTML(p){
  const id = p.titulo.replace(/[^a-zA-Z0-9]/g,'');
  return `
    <div class="card">
      <div class="card-topo">
        <h3 class="card-titulo">${p.titulo}</h3>
      </div>
      <div class="card-texto" id="texto-${id}">${escapeHTML(p.texto)}<div class="fade"></div></div>
      <div class="card-acoes">
        <button class="ver-mais">ver mais</button>
        <button class="copiar-btn" data-alvo="texto-${id}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copiar
        </button>
      </div>
    </div>
  `;
}

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function copiarTexto(btn){
  const alvo = document.getElementById(btn.dataset.alvo);
  const texto = alvo.textContent.trim();
  try{
    await navigator.clipboard.writeText(texto);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = texto;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  const originalHTML = btn.innerHTML;
  btn.classList.add('copiado');
  btn.innerHTML = '✓ Copiado';
  setTimeout(()=>{
    btn.classList.remove('copiado');
    btn.innerHTML = originalHTML;
  }, 1500);
}

campoBusca.addEventListener('input', renderizar);

montarFiltros();
renderizar();

// PWA install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('bannerInstalar').classList.add('visivel');
});
document.getElementById('btnInstalar').addEventListener('click', async ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('bannerInstalar').classList.remove('visivel');
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
